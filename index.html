<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money HQ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#221E17">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="storage-shim.js"></script>
<style>
  :root{
    --bg:#F1E9D8; --panel:#FFFDF9; --panel-2:#F2E8D6; --line:#E4D6BC;
    --label:#8C8171; --text:#221E17; --amber:#D9713A; --amber-dim:#F7E1C4;
    --teal:#6B8F63; --teal-dim:#E4EBDF; --red:#C1553B; --purple:#B98089; --blue:#5C7A99;
    --font-serif: Georgia, 'Times New Roman', serif;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:32px 16px 60px;}
  .wrap{max-width:980px;margin:0 auto;}
  .wrap.narrow{max-width:660px;}
  h1{font-family:var(--font-serif);font-size:42px;font-weight:400;letter-spacing:0;color:var(--text);margin:0 0 4px;}
  .subtitle{color:var(--label);font-size:13px;margin:0 0 24px;font-family:var(--font-sans);}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  .tab-btn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:500;color:var(--label);cursor:pointer;}
  .tab-btn.active{background:var(--text);color:var(--panel);border-color:var(--text);}
  .tab-btn:hover{border-color:var(--amber);}
  .tab-btn.add-tab{border-style:dashed;color:var(--teal);border-color:var(--teal);}
  .tab-btn.add-tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .tab-btn.primary-tab{color:var(--blue);}
  .tab-btn.primary-tab.active{background:var(--text);color:var(--panel);border-color:var(--text);}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 1px 3px rgba(60,45,20,0.05);}
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--label);margin-bottom:8px;}
  .kpi-val{font-size:26px;font-weight:400;font-family:var(--font-serif);font-variant-numeric:tabular-nums;}
  .kpi-sub{font-size:12px;color:var(--label);margin-top:4px;}

  .kpi-hero{border-radius:16px;padding:24px 26px;box-shadow:0 1px 3px rgba(60,45,20,0.05);}
  .kpi-hero-val{font-family:var(--font-serif);font-size:32px;font-weight:400;font-variant-numeric:tabular-nums;}
  .kpi-hero-caption{font-size:13px;margin-top:10px;line-height:1.4;}
  .kpi-hero.black{background:var(--text);color:var(--panel);}
  .kpi-hero.black .kpi-hero-caption{color:#CFC8B9;}
  .kpi-hero.orange{background:var(--amber);color:#fff;}
  .kpi-hero.orange .kpi-hero-caption{color:#FBE6D5;}
  .kpi-hero.peach{background:var(--amber-dim);color:var(--text);}
  .kpi-hero.peach .kpi-hero-caption{color:var(--label);}
  .kpi-hero.blue{background:var(--blue);color:#fff;}
  .kpi-hero.blue .kpi-hero-caption{color:#DCE6ED;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(60,45,20,0.05);}
  .card h2, .card-title{font-size:17px;font-weight:400;font-family:var(--font-serif);margin:0 0 16px;text-transform:none;letter-spacing:0;color:var(--text);}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .card-header h2{margin:0;}
  .card-note{font-size:12px;color:var(--label);margin:-10px 0 16px;line-height:1.55;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip-btn{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:11px;font-weight:500;color:var(--label);cursor:pointer;}
  .chip-btn:hover{border-color:var(--amber);color:var(--amber);}
  .chip-btn.active{background:var(--text);color:var(--panel);border-color:var(--text);}

  .chart-box{position:relative;height:260px;}
  .chart-box.small{height:340px;}
  .chart-box.large{height:460px;}

  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  th{text-align:left;padding:10px 8px;color:var(--label);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--line);background:var(--panel-2);}
  th:first-child{border-radius:8px 0 0 0;}
  th:last-child{border-radius:0 8px 0 0;}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
  td.num, th.num{text-align:right;font-family:var(--font-sans);white-space:nowrap;}
  tr.income td.num{color:var(--teal);}
  tr.expense td.num{color:var(--text);}
  tr.totals-row td{font-weight:600;border-top:2px solid var(--text);border-bottom:none;color:var(--amber);}
  .cat-pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--label);border:1px solid var(--line);}
  .txn-table-wrap{max-height:460px;overflow-y:auto;}
  .cat-select{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 10px;font-family:var(--font-sans);max-width:150px;}
  .note-input{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:12px;padding:6px 10px;width:100%;min-width:100px;}
  .note-input::placeholder{color:var(--label);}
  .cat-select.pending-edit{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber);}
  .volatility-pill{display:inline-block;margin-top:4px;font-size:10px;padding:2px 9px;border-radius:999px;background:var(--panel-2);color:var(--label);border:1px solid var(--line);}
  .dev-pos{color:var(--teal);}
  .dev-neg{color:var(--red);}
  .balance-table td{vertical-align:top;padding:14px 18px;text-align:center;}
  .balance-table th{text-align:center;padding:10px 18px;}
  .balance-table tr:hover td{background:var(--panel-2);}
  .history-table td, .history-table th{text-align:center;padding:11px 18px;}
  .history-table tbody tr:last-of-type:not(.totals-row) td{background:var(--amber-dim);}

  .drop-zone{border:2px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;transition:.15s;background:var(--panel-2);}
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--teal);background:var(--teal-dim);}
  .drop-zone .big-label{font-size:14px;font-weight:500;margin-bottom:6px;color:var(--text);}
  .drop-zone .small-label{font-size:12px;color:var(--label);}
  .preview-summary{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:16px 18px;background:var(--panel-2);border-radius:12px;font-size:13px;}
  .preview-summary .stat{font-family:var(--font-serif);color:var(--amber);font-weight:400;font-size:15px;}
  button.primary-btn{background:var(--teal);border:1px solid var(--teal);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;}
  button.primary-btn:hover{opacity:0.9;}
  button.ghost-btn{background:var(--panel);border:1px solid var(--line);color:var(--label);border-radius:999px;padding:10px 18px;font-size:13px;cursor:pointer;}
  .status-msg{font-size:12px;margin-top:10px;color:var(--teal);}

  .indicator{width:9px;height:9px;border-radius:50%;background:var(--red);display:inline-block;margin-right:6px;}
  .indicator.ok{background:var(--teal);}
  .pay-input{display:flex;align-items:center;gap:10px;}
  .pay-input span{font-family:var(--font-serif);font-size:22px;color:var(--label);}
  .pay-input input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--font-serif);font-size:22px;padding:10px 14px;font-weight:400;}
  .pay-input input:focus{outline:none;border-color:var(--amber);}

  .channel{border-top:1px solid var(--line);padding:16px 0;}
  .channel:first-of-type{border-top:none;padding-top:4px;}
  .ch-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .ch-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;}
  .ch-acct{font-family:var(--font-sans);font-size:10px;color:var(--purple);border:1px solid var(--line);border-radius:999px;padding:2px 8px;}
  .ch-pct{font-family:var(--font-sans);font-size:13px;color:var(--amber);min-width:38px;text-align:right;}
  .ch-amt{font-family:var(--font-serif);font-size:18px;font-weight:400;min-width:100px;text-align:right;}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line);outline:none;transition:background .15s ease;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);cursor:pointer;border:2px solid var(--panel);transition:transform .15s ease, box-shadow .15s ease;}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3);box-shadow:0 0 0 6px rgba(217,113,58,0.18);}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);cursor:pointer;border:2px solid var(--panel);transition:transform .15s ease, box-shadow .15s ease;}
  input[type=range]::-moz-range-thumb:hover{transform:scale(1.15);}
  input[type=range]:active::-moz-range-thumb{transform:scale(1.3);box-shadow:0 0 0 6px rgba(217,113,58,0.18);}

  .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:16px;background:var(--panel-2);}
  .seg{height:100%;}

  .total-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-family:var(--font-sans);font-size:12px;color:var(--label);}
  .total-row .val{font-weight:600;}
  .total-row .val.bad{color:var(--red);}
  .total-row .val.good{color:var(--teal);}

  .buffer-note{background:var(--teal-dim);border:1px solid var(--teal);border-radius:12px;padding:14px 18px;margin-top:16px;font-size:12px;line-height:1.55;color:#3F5A38;}

  .btn-row{display:flex;gap:10px;margin-top:18px;}
  button{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;color:var(--text);font-family:var(--font-sans);font-size:13px;font-weight:500;padding:10px;cursor:pointer;}
  .btn-row button{flex:1;}
  button:hover{border-color:var(--amber);}
  button.primary{background:var(--text);border-color:var(--text);color:var(--panel);}
  button.primary:hover{opacity:0.88;}
  button:active{transform:scale(0.98);}

  .freq-btn{flex:1;}
  .freq-btn.active{background:var(--text);border-color:var(--text);color:var(--panel);}
  details summary::-webkit-details-marker{display:none;}
  summary .chev{display:inline-block;transition:transform .18s ease;font-size:12px;color:var(--label);}
  details[open] summary .chev{transform:rotate(180deg);color:var(--amber);}
  .info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--label);color:var(--label);font-size:10px;font-style:italic;font-family:var(--font-serif);font-weight:400;cursor:help;position:relative;vertical-align:middle;margin-left:7px;line-height:1;}
  .info:hover,.info:focus{border-color:var(--amber);color:var(--amber);outline:none;}
  .info .info-pop{display:none;position:absolute;left:0;top:150%;width:240px;max-width:72vw;background:var(--text);color:var(--panel);font-size:12px;font-style:normal;font-weight:400;line-height:1.45;letter-spacing:0;text-transform:none;padding:9px 11px;border-radius:8px;z-index:30;box-shadow:0 6px 18px rgba(60,45,20,0.22);}
  .info:hover .info-pop,.info:focus .info-pop,.info:focus-within .info-pop{display:block;}
  .fixflex{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;}
  .fixflex > div{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:10px;}
  .fixflex-label{color:var(--label);}
  .fixflex-val{font-family:var(--font-mono);color:var(--text);font-weight:500;white-space:nowrap;}
  .fixflex-val.bad{color:var(--red);}
  .goal{padding:14px 0;border-top:1px solid var(--line);}
  .goal:first-child{border-top:none;padding-top:4px;}
  .goal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;}
  .goal-name{font-weight:600;color:var(--text);}
  .goal-amts{font-family:var(--font-mono);font-size:13px;color:var(--label);white-space:nowrap;}
  .goal-done .goal-amts{color:var(--teal);font-weight:600;}
  .goal-bar{height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden;}
  .goal-fill{height:100%;width:0;background:var(--amber);border-radius:999px;transition:width .35s ease;}
  .goal-fill.done{background:var(--teal);}
  .goal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap;}
  .goal-pct{font-size:12px;color:var(--label);}
  .goal-actions{display:flex;align-items:center;gap:6px;}
  .goal-add-wrap{display:flex;align-items:center;gap:2px;}
  .goal-dollar{color:var(--label);font-size:13px;}
  .goal-add-input{width:72px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;color:var(--text);text-align:right;padding:4px 6px;font-size:13px;}
  button.goal-add-btn{padding:6px 12px;font-size:12px;}
  button.goal-del-btn{padding:6px 10px;font-size:12px;}
  .goal-create{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap;}
  .goal-create .note-input{width:auto;flex:1;min-width:140px;}
  .goal-target-wrap{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
  .goal-target-wrap .note-input{flex:0 0 auto;}

  .empty{font-size:12px;color:var(--label);font-style:italic;padding:6px 0;}

  .hero-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:16px;}
  .hero-date{font-size:13px;color:var(--label);margin-bottom:4px;}
  .hero-stat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--label);text-align:right;margin-bottom:4px;}
  .hero-stat-val{font-family:var(--font-serif);font-size:36px;font-weight:400;text-align:right;}
  .hero-stat-delta{font-size:13px;text-align:right;margin-top:2px;}

  .flow-svg text{font-family:var(--font-sans);}
  .flow-label-name{font-size:13px;font-weight:600;fill:var(--text);}
  .flow-label-amt{font-size:12px;fill:var(--label);}

  .section{display:none;}
  .section.active{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero-row">
    <div>
      <p class="hero-date" id="heroDate"></p>
      <h1>Welcome back</h1>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="sections"></div>
</div>

<script>
/* =========================================================
   SHARED HELPERS
   ========================================================= */
function fmt(n){ const s = n<0 ? '-' : ''; return s + '$' + Math.round(Math.abs(n)).toLocaleString(); }
function fmtCents(n){ return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
const MONTH_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(m){ const [y,mm] = m.split('-'); return MONTH_LONG[parseInt(mm,10)-1] + ' ' + y; }
function monthShort(m){ const [y,mm] = m.split('-'); return MONTH_SHORT[parseInt(mm,10)-1]; }

const tabsEl = document.getElementById('tabs');
const sectionsEl = document.getElementById('sections');
function showTab(id){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.dataset.section===id));
}

/* =========================================================
   BUCKETS + HISTORY (paycheque splitting)
   ========================================================= */
// Neutral starter config. Real buckets, targets, and account names come from
// your own backup file via Restore, or by editing these in the Buckets tab.
const DEFAULTS = [
  {key:'rent', name:'Rent', tag:'Chequing', pct:11.3, color:'#2E5C8A', target:0, hasTarget:true},
  {key:'insurance', name:'Insurance', tag:'Chequing', pct:5.6, color:'#7F77DD', target:0, hasTarget:true},
  {key:'subs', name:'Subscriptions', tag:'Chequing', pct:4.6, color:'#D4537E', target:0, hasTarget:true},
  {key:'tfsa', name:'TFSA', tag:'Chequing', pct:11.3, color:'#5DCAA5', target:0, hasTarget:true},
  {key:'groceries', name:'Groceries', tag:'Chequing', pct:7.9, color:'#EF9F27', target:0, hasTarget:true},
  {key:'creditcard', name:'Credit card payment', tag:'Chequing', pct:9.0, color:'#D9534F', target:0, hasTarget:true},
  {key:'save', name:'Save', tag:'Savings', pct:25.2, color:'#3FAE8C', target:0, hasTarget:false},
  {key:'spend', name:'Spend', tag:'Chequing', pct:25.1, color:'#F2A93B', target:0, hasTarget:false}
];
const PERIODS_PER_YEAR = { weekly: 52, biweekly: 26, monthly: 12 };
const FREQ_LABEL = { weekly: 'Standard weekly pay', biweekly: 'Standard biweekly pay', monthly: 'Standard monthly pay' };

let channels = JSON.parse(JSON.stringify(DEFAULTS));
let standardPay = 0;
let frequency = 'weekly';
let payHistory = [];

const DEFAULT_ACCOUNTS = [
  { id:'chequing', name:'Chequing', type:'Chequing' },
  { id:'savings', name:'Savings', type:'Savings' }
];
let accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));

async function loadAccounts(){
  try{ const s = await window.storage.get('accounts-list'); if (s && s.value) accounts = JSON.parse(s.value); }catch(e){}
}
async function saveAccounts(){ try{ await window.storage.set('accounts-list', JSON.stringify(accounts)); }catch(e){} }

let accountChangeLog = [];
async function loadAccountChangeLog(){
  try{ const s = await window.storage.get('account-change-log'); if (s && s.value) accountChangeLog = JSON.parse(s.value); }catch(e){}
}
async function logAccountChange(bucketName, oldTag, newTag){
  if (oldTag === newTag) return;
  accountChangeLog.unshift({ date: new Date().toLocaleDateString('en-CA'), bucket: bucketName, from: oldTag, to: newTag });
  accountChangeLog = accountChangeLog.slice(0, 200);
  try{ await window.storage.set('account-change-log', JSON.stringify(accountChangeLog)); }catch(e){}
}

function accountTxnStats(accountName){
  let count = 0, minDate = null, maxDate = null;
  MONTHS.forEach(m => {
    (TXNS[m]||[]).forEach(t => {
      if (getAccount(t) !== accountName) return;
      count++;
      if (!minDate || t.date < minDate) minDate = t.date;
      if (!maxDate || t.date > maxDate) maxDate = t.date;
    });
  });
  return { count, minDate, maxDate };
}

function setFrequency(f){
  frequency = f;
  document.querySelectorAll('.freq-btn').forEach(b => b.classList.toggle('active', b.dataset.freq === f));
  const lbl = document.getElementById('stdPayLabel');
  if (lbl) lbl.textContent = FREQ_LABEL[f];
  updatePayNote();
}
function updatePayNote(){
  const el = document.getElementById('payNote');
  if (!el) return;
  const freqWord = {weekly:'week', biweekly:'2 weeks', monthly:'month'}[frequency];
  el.textContent = `Standard pay is ${fmtCents(standardPay)}/${freqWord}. Any extra is included here — it flows through the same percentages as everything else, so every bucket gets a little more instead of extra going to one place.`;
  renderPayFixedSummary();
}

function renderTargetInputs(){
  const el = document.getElementById('targetInputs');
  if (!el) return;
  const accountOptions = accounts.map(a=>a.name);
  el.innerHTML = channels.map((c) => {
    const idx = channels.indexOf(c);
    const acctOpts = accountOptions.includes(c.tag)
      ? accountOptions
      : [c.tag, ...accountOptions];
    const acctSelect = `<select class="cat-select acct-reassign" data-idx="${idx}" style="max-width:150px;">
      ${acctOpts.map(name => `<option value="${name}" ${name===c.tag?'selected':''}>${name}</option>`).join('')}
    </select>`;
    if (c.hasTarget){
      return `
      <div class="channel">
        <div class="ch-top"><div class="ch-name">${c.name} — real $/month</div>
          <input class="ch-amt" data-idx="${idx}" type="number" step="5" value="${c.target}" style="width:100px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;color:var(--amber);text-align:right;padding:6px 8px;">
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:6px;">${acctSelect}</div>
      </div>`;
    }
    return `
    <div class="channel">
      <div class="ch-top"><div class="ch-name">${c.name} <span class="kpi-sub">(no fixed target)</span></div>${acctSelect}</div>
    </div>`;
  }).join('');

    channels[parseInt(e.target.dataset.idx)].target = parseFloat(e.target.value) || 0;

    await logAccountChange(channels[idx].name, oldTag, e.target.value);
    if (builtSections.has('history')) renderAccountChangeLog();
    renderBuckets();
  }));

function recalculate(){
  standardPay = parseFloat(document.getElementById('setStdPay').value) || standardPay;
  const periods = PERIODS_PER_YEAR[frequency];
  const withTarget = channels.filter(c => c.hasTarget);
  const withoutTarget = channels.filter(c => !c.hasTarget);
  let usedPct = 0;
  withTarget.forEach(c => {
    const periodTarget = c.target * 12 / periods;
    c.pct = Math.round((periodTarget / standardPay * 100) * 10) / 10;
    usedPct += c.pct;
  });
  const remainingPct = Math.max(0, 100 - usedPct);
  let assigned = 0;
  withoutTarget.forEach((c, i) => {
    if (i === withoutTarget.length - 1){
      c.pct = Math.round((remainingPct - assigned) * 10) / 10;
    } else {
      c.pct = Math.round((remainingPct / withoutTarget.length) * 10) / 10;
      assigned += c.pct;
    }
  });
  updatePayNote();
  renderBuckets();
}

const VOLATILITY = {
  rent: 'Rarely changes', insurance: 'Rarely changes', tfsa: 'Rarely changes',
  subs: 'Varies monthly', groceries: 'Varies monthly', creditcard: 'Varies monthly',
  save: 'Fully flexible', spend: 'Fully flexible'
};
function volatilityFor(c){ return VOLATILITY[c.key] || (c.hasTarget ? 'Varies monthly' : 'Fully flexible'); }

let cumulativeCache = null;
let cumulativeCacheDirty = true;
function computeBucketCumulative(){
  if (!cumulativeCacheDirty && cumulativeCache) return cumulativeCache;
  const totals = {};
  let minDate=null, maxDate=null;
  payHistory.forEach(h => {
    if (!minDate || h.date < minDate) minDate = h.date;
    if (!maxDate || h.date > maxDate) maxDate = h.date;
    (h.channels||[]).forEach(c => { totals[c.name] = (totals[c.name]||0) + c.amt; });
  });
  let monthsElapsed = payHistory.length ? 1 : 0;
  if (minDate && maxDate){
    const days = (new Date(maxDate) - new Date(minDate))/86400000 + 1;
    monthsElapsed = Math.max(days/30.44, 1);
  }
  cumulativeCache = { totals, monthsElapsed };
  cumulativeCacheDirty = false;
  return cumulativeCache;
}

function currentImbalance(){
  return channels.reduce((s,c)=>s+c.pct,0) - 100;
}

function renderBalancePanel(){
  const panelEl = document.getElementById('balancePanel');
  if (!panelEl) return;
  const imbalance = currentImbalance();
  if (Math.abs(imbalance) < 0.05){
    panelEl.style.display = 'none';
    panelEl.innerHTML = '';
    return;
  }
  panelEl.style.display = '';
  const over = imbalance > 0;
  const periods = PERIODS_PER_YEAR[frequency];
  const { totals: cumTotals, monthsElapsed } = computeBucketCumulative();
  const net = parseFloat(document.getElementById('payAmt').value) || 0;
  const basis = net > 0 ? net : standardPay;

  const rows = channels.map(c => {
    const bucketTotal = cumTotals[c.name] || 0;
    let targetPct=null, targetAmt=null, targetDisplayAmt=null, deviationPct=null, surplusVal, surplusLabel;
    if (c.hasTarget){
      targetAmt = c.target * 12 / periods;
      targetPct = standardPay > 0 ? targetAmt/standardPay*100 : 0;
      targetDisplayAmt = basis * targetPct/100;
      deviationPct = c.pct - targetPct;
      const expectedCum = c.target * monthsElapsed;
      surplusVal = bucketTotal - expectedCum;
      surplusLabel = (surplusVal>=0?'+':'') + fmtCents(surplusVal);
    } else {
      surplusVal = bucketTotal;
      surplusLabel = fmtCents(bucketTotal) + ' cumulative';
    }
    return { key:c.key, name:c.name, volatility: volatilityFor(c), pct:c.pct, amt: basis*c.pct/100,
      bucketTotal, hasTarget:c.hasTarget, targetPct, targetAmt, targetDisplayAmt, deviationPct, surplusVal, surplusLabel };
  }).sort((a,b) => b.surplusVal - a.surplusVal);

  const actionWord = over ? 'Remove from' : 'Add to';
  const amtNeededPct = Math.abs(imbalance);
  const amtNeededDollars = basis * amtNeededPct/100;

  panelEl.innerHTML = `
    <div class="buffer-note" style="background:#2E2416;border-color:#6B5527;color:#F2C98A;">
      Total is ${(100+imbalance).toFixed(1)}% — ${over ? 'over' : 'under'} by ${amtNeededPct.toFixed(1)}% (${fmtCents(amtNeededDollars)}). Ranked by real surplus from your actual history, not just this cycle.
    </div>
    <div class="txn-table-wrap" style="margin-top:12px;">
      <table class="balance-table">
        <thead><tr>
          <th>Bucket</th>
          <th class="num">Bucket total</th>
          <th>Current cycle split</th>
          <th class="num">Surplus</th>
          <th></th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><div>${r.name}</div><span class="volatility-pill">${r.volatility}</span></td>
              <td class="num">${fmtCents(r.bucketTotal)}</td>
              <td>${r.hasTarget
                  ? `<div class="kpi-sub">Target: ${r.targetPct.toFixed(1)}% (${fmtCents(r.targetDisplayAmt)})</div><div>${r.pct.toFixed(1)}% (${fmtCents(r.amt)}) <span class="${r.deviationPct>=0?'dev-pos':'dev-neg'}">${r.deviationPct>=0?'+':''}${r.deviationPct.toFixed(1)}%</span></div>`
                  : `<div class="kpi-sub">no fixed target</div><div>${r.pct.toFixed(1)}% (${fmtCents(r.amt)})</div>`}
              </td>
              <td class="num ${r.hasTarget ? (r.surplusVal>=0?'dev-pos':'dev-neg') : ''}">${r.surplusLabel}</td>
              <td><button class="ghost-btn" data-key="${r.key}" style="padding:4px 10px;font-size:11px;">${actionWord}</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
  panelEl.querySelectorAll('button[data-key]').forEach(btn => {
    btn.addEventListener('click', () => applyBalanceAdjustment(btn.dataset.key));
  });
}

function applyBalanceAdjustment(key){
  const imbalance = currentImbalance();
  const ch = channels.find(c=>c.key===key);
  if (!ch) return;
  ch.pct = Math.max(0, Math.round((ch.pct - imbalance) * 10) / 10);
  updateBucketValues();
}

function updateBucketValues(){

  try{ const h = await window.storage.get('pct-router-history'); if(h && h.value) payHistory = JSON.parse(h.value); }catch(e){}
  await migrateChannels();
}

async function migrateChannels(){
  const existingKeys = new Set(channels.map(c=>c.key));
  const missing = DEFAULTS.filter(d => !existingKeys.has(d.key));
  if (!missing.length) return;

  missing.forEach(def => channels.push(JSON.parse(JSON.stringify(def))));
  const order = DEFAULTS.map(d=>d.key);
  channels.sort((a,b) => order.indexOf(a.key) - order.indexOf(b.key));

  const save = channels.find(c=>c.key==='save');
  const spend = channels.find(c=>c.key==='spend');
  missing.forEach(def => {
    const newChannel = channels.find(c=>c.key===def.key);
    if (!newChannel || !save || !spend) return;
    const flexSum = save.pct + spend.pct;
    const take = Math.min(def.pct, flexSum);
    if (flexSum > 0){
      const saveShare = save.pct/flexSum;
      save.pct = Math.max(0, save.pct - take*saveShare);
      spend.pct = Math.max(0, spend.pct - take*(1-saveShare));
    }
    newChannel.pct = take;
  });

  try{ await window.storage.set('pct-router-config', JSON.stringify(channels)); }catch(e){}
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Live "fixed vs flexible" summary in the pay-period card. Fixed = sum of every
// bucket target ($/month) converted to this pay period; flexible = the rest.
// Recomputed whenever targets, pay, frequency, or standard pay change.
function renderPayFixedSummary(){
  const el = document.getElementById('payFixedSummary');

  const basis = net > 0 ? net : standardPay;
  const fixedPerPeriod = channels.filter(c => c.hasTarget).reduce((s,c) => s + (c.target*12/periods), 0);
  const flexible = basis - fixedPerPeriod;
  const freqWord = {weekly:'week', biweekly:'2 weeks', monthly:'month'}[frequency];
  const basisLabel = net > 0 ? 'this pay' : `a standard ${freqWord}`;
  el.innerHTML = `
    <div class="fixflex">

      <div><span class="fixflex-label">Flexible — everything else</span><span class="fixflex-val ${flexible<0?'bad':''}">${fmtCents(flexible)}</span></div>
    </div>`;
}

async function addSavingsGoal(name, target){
  name = (name||'').trim();
  target = parseFloat(target) || 0;
  if (!name || target <= 0) return false;
  savingsGoals.push({ id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, target, saved:0, createdAt:new Date().toISOString() });
  await saveSavingsGoals();
  renderSavingsGoals();
  return true;
}
async function addGoalContribution(id, amt){
  const g = savingsGoals.find(x => x.id === id);
  if (!g) return;
  g.saved = Math.max(0, Math.round((g.saved + amt)*100)/100);
  await saveSavingsGoals();
  renderSavingsGoals();
}
async function removeSavingsGoal(id){
  const g = savingsGoals.find(x => x.id === id);
  if (g && g.saved > 0 && !confirm('Delete “'+g.name+'”? Its '+fmtCents(g.saved)+' of tracked progress will be removed.')) return;
  savingsGoals = savingsGoals.filter(x => x.id !== id);
  await saveSavingsGoals();
  renderSavingsGoals();
}

      await window.storage.set('pct-router-frequency', frequency);
      if (net > 0){
        const periods = PERIODS_PER_YEAR[frequency];
        const entry = {
          date: new Date().toLocaleDateString('en-CA'),
          net,
          channels: channels.map(c => {
            let targetPct = null, targetAmt = null;
            if (c.hasTarget){
              targetAmt = c.target * 12 / periods;
              targetPct = standardPay > 0 ? (targetAmt/standardPay*100) : null;
            }
            return {
              name: c.name, tag: c.tag, hasTarget: c.hasTarget,
              pct: c.pct, amt: Math.round(net*c.pct/100*100)/100,
              targetPct, targetAmt
            };
          })
        };
        payHistory.unshift(entry);
        payHistory = payHistory.slice(0, 200);
        await window.storage.set('pct-router-history', JSON.stringify(payHistory));
        cumulativeCacheDirty = true;
        if (builtSections.has('history')) buildHistorySectionContent();
        renderHero();
      }
    }catch(e){ console.error('Storage error', e); }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    channels = JSON.parse(JSON.stringify(DEFAULTS));
    standardPay = 1024;
    setFrequency('weekly');
    document.getElementById('setStdPay').value = standardPay;
    renderTargetInputs();
    renderBuckets();
  });

  setFrequency(frequency);
  document.getElementById('setStdPay').value = standardPay;
  renderTargetInputs();
  renderBuckets();

  renderSavingsGoals();
  const addGoalBtn = document.getElementById('addGoalBtn');
  if (addGoalBtn) addGoalBtn.addEventListener('click', async () => {
    const nameEl = document.getElementById('newGoalName');
    const targetEl = document.getElementById('newGoalTarget');
    const msg = document.getElementById('goalMsg');
    const ok = await addSavingsGoal(nameEl.value, targetEl.value);
    if (!ok){ if (msg) msg.textContent = 'Enter a goal name and a target amount above $0.'; return; }
    if (msg) msg.textContent = '';
    nameEl.value = ''; targetEl.value = '';
  });
}

const AFFORD_FREQ_WORD = { weekly: 'week', biweekly: 'pay period', monthly: 'month' };

function wireAffordabilityCalculator(){
  document.querySelectorAll('#affordModeRow .freq-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#affordModeRow .freq-btn').forEach(x => x.classList.toggle('active', x===b));
      document.getElementById('affordRecurring').style.display = b.dataset.mode==='recurring' ? '' : 'none';
      document.getElementById('affordOnetime').style.display = b.dataset.mode==='onetime' ? '' : 'none';
    });
  });
  document.getElementById('affordRecurringAmt').addEventListener('input', renderAffordRecurring);
  document.getElementById('affordOnetimeAmt').addEventListener('input', renderAffordOnetime);
}

function renderAffordRecurring(){
  const el = document.getElementById('affordRecurringResult');
  const amt = parseFloat(document.getElementById('affordRecurringAmt').value) || 0;
  if (amt <= 0){ el.innerHTML = ''; return; }

  const periods = PERIODS_PER_YEAR[frequency];
  const periodTarget = amt * 12 / periods;
  const newPct = periodTarget / standardPay * 100;

  const save = channels.find(c=>c.key==='save');
  const spend = channels.find(c=>c.key==='spend');
  const flexPct = (save ? save.pct : 0) + (spend ? spend.pct : 0);
  const remainingFlexPct = flexPct - newPct;
  const freqWord = AFFORD_FREQ_WORD[frequency];

  if (remainingFlexPct < 0){
    const shortfallPct = Math.abs(remainingFlexPct);
    const shortfallAmt = standardPay * shortfallPct / 100;
    el.innerHTML = `
      <div class="buffer-note" style="background:#2E1E1E;border-color:#6B2A26;color:#E8A29C;">
        Doesn't fit without cutting a fixed bucket. This would need ${newPct.toFixed(1)}% of a standard paycheque (${fmtCents(periodTarget)}/${freqWord}), but Save + Spend together only have ${flexPct.toFixed(1)}%.
        Short by ${fmtCents(shortfallAmt)}/${freqWord} — either trim a fixed bucket (Rent, Subscriptions, etc.) or this doesn't fit at your current pay.
      </div>`;
    return;
  }

  const ratio = flexPct > 0 ? (save.pct / flexPct) : 0.5;
  const newSavePct = remainingFlexPct * ratio;
  const newSpendPct = remainingFlexPct - newSavePct;
  const oldSaveAmt = standardPay * save.pct/100;
  const oldSpendAmt = standardPay * spend.pct/100;
  const newSaveAmt = standardPay * newSavePct/100;
  const newSpendAmt = standardPay * newSpendPct/100;

  el.innerHTML = `
    <div class="buffer-note">
      Fits. This would take ${newPct.toFixed(1)}% (${fmtCents(periodTarget)}/${freqWord}) out of Save + Spend, split proportionally:
    </div>
    <table style="margin-top:10px;">
      <thead><tr><th></th><th class="num">Now</th><th class="num">With this added</th></tr></thead>
      <tbody>
        <tr><td>Save</td><td class="num">${fmtCents(oldSaveAmt)}</td><td class="num">${fmtCents(newSaveAmt)}</td></tr>
        <tr><td>Spend</td><td class="num">${fmtCents(oldSpendAmt)}</td><td class="num">${fmtCents(newSpendAmt)}</td></tr>
      </tbody>
    </table>
    <p class="kpi-sub" style="margin-top:8px;">Annualized cost: ${fmtCents(amt*12)}/year. This is a preview only — your real buckets are unchanged.</p>
  `;
}

function renderAffordOnetime(){
  const el = document.getElementById('affordOnetimeResult');
  const cost = parseFloat(document.getElementById('affordOnetimeAmt').value) || 0;
  if (cost <= 0){ el.innerHTML = ''; return; }

  const save = channels.find(c=>c.key==='save');
  const savePerPeriod = standardPay * (save ? save.pct : 0) / 100;
  const freqWord = AFFORD_FREQ_WORD[frequency];

  if (savePerPeriod <= 0){
    el.innerHTML = `<div class="buffer-note" style="background:#2E1E1E;border-color:#6B2A26;color:#E8A29C;">Save bucket is currently 0% — nothing to project against.</div>`;
    return;
  }

  const periodsNeeded = Math.ceil(cost / savePerPeriod);
  const weeksPerPeriod = { weekly:1, biweekly:2, monthly:4.33 }[frequency];
  const weeksNeeded = Math.round(periodsNeeded * weeksPerPeriod);

  const loggedSaveTotal = payHistory.reduce((sum,h) => {
    const c = (h.channels||[]).find(x=>x.name==='Save');
    return sum + (c ? c.amt : 0);
  }, 0);
  const pctOfLogged = loggedSaveTotal > 0 ? (cost/loggedSaveTotal*100) : null;

  el.innerHTML = `
    <div class="buffer-note">
      At your current Save rate of ${fmtCents(savePerPeriod)}/${freqWord}, this would take <b>${periodsNeeded} pay period${periodsNeeded>1?'s':''}</b> (~${weeksNeeded} weeks) to save up from scratch.
    </div>
    ${loggedSaveTotal > 0 ? `<p class="kpi-sub" style="margin-top:8px;">You've logged ${fmtCents(loggedSaveTotal)} to Save across your paycheque history — this purchase would be ${pctOfLogged.toFixed(0)}% of that. (Based on logged paycheques only, not your actual bank balance.)</p>` : ''}
  `;
}


function buildHistorySectionContent(){
  const wrap = document.getElementById('historyTableWrap');
  const kpiRow = document.getElementById('historyKpiRow');
  if (!wrap || !kpiRow) return;

  if (!payHistory.length){
    kpiRow.innerHTML = '';
    wrap.innerHTML = '<p class="empty">No paycheques logged yet — save a split in the Buckets tab to start building history.</p>';
    return;
  }

  const currentNames = channels.map(c=>c.name);
  const historicalNames = payHistory.flatMap(h => (h.channels||[]).map(c=>c.name));
  const bucketNames = Array.from(new Set([...currentNames, ...historicalNames]));
  const totalsByBucket = {};
  bucketNames.forEach(n => totalsByBucket[n] = 0);
  let totalNet = 0;
  payHistory.forEach(h => {
    totalNet += h.net;
    (h.channels||[]).forEach(c => { totalsByBucket[c.name] = (totalsByBucket[c.name]||0) + c.amt; });
  });

  kpiRow.innerHTML = `
    <div class="kpi"><div class="kpi-label">Paycheques logged</div><div class="kpi-val">${payHistory.length}</div></div>
    <div class="kpi"><div class="kpi-label">Total net logged</div><div class="kpi-val">${fmtCents(totalNet)}</div></div>
    <div class="kpi"><div class="kpi-label">Average per paycheque</div><div class="kpi-val">${fmtCents(totalNet/payHistory.length)}</div></div>
  `;

  const rows = payHistory.map(h => {
    const cells = bucketNames.map(n => {
      const match = (h.channels||[]).find(c => c.name === n);
      return `<td class="num">${match ? fmtCents(match.amt) : fmtCents(0)}</td>`;
    }).join('');
    return `<tr><td>${h.date}</td><td class="num">${fmtCents(h.net)}</td>${cells}</tr>`;
  }).join('');

  const totalsCells = bucketNames.map(n => `<td class="num">${fmtCents(totalsByBucket[n])}</td>`).join('');

  wrap.innerHTML = `
    <div class="txn-table-wrap">
      <table class="history-table">
        <thead><tr><th>Date</th><th class="num">Net pay</th>${bucketNames.map(n=>`<th class="num">${n}</th>`).join('')}</tr></thead>

  wireHistoryBucketPicker(bucketNames);
  renderAccountHistoryTable();
  renderAccountChangeLog();
}

function aggregateMonthlyForBucket(name){
  const monthly = {};
  payHistory.forEach(h => {
    const c = (h.channels||[]).find(x=>x.name===name);
    if (!c) return;
    const month = h.date.slice(0,7);
    if (!monthly[month]) monthly[month] = { actual:0, target:0, hasTarget: !!c.hasTarget };
    monthly[month].actual += c.amt;
    if (c.hasTarget && c.targetAmt !== null && c.targetAmt !== undefined) monthly[month].target += c.targetAmt;
  });
  const months = Object.keys(monthly).sort();
  return { months, data: monthly };
}

function wireHistoryBucketPicker(bucketNames){

function renderHistoryBucketChart(name){
  const container = document.getElementById('historyChartsGrid');
  if (!container) return;
  if (chartInstances['hist-current']){ chartInstances['hist-current'].destroy(); delete chartInstances['hist-current']; }

  const { months, data } = aggregateMonthlyForBucket(name);
  if (!months.length){
    container.innerHTML = '<p class="empty">No logged paycheques for this bucket yet.</p>';
    return;
  }
  const hasTarget = data[months[0]].hasTarget;
  container.innerHTML = `<div class="chart-box" style="height:280px;"><canvas id="historyBucketCanvas"></canvas></div>`;
  const canvas = document.getElementById('historyBucketCanvas');
  const labels = months.map(monthShortLabel);

  const datasets = [];
  if (hasTarget){
    datasets.push({ label:'Target', data: months.map(m=>data[m].target), borderColor:'#5C7A99', backgroundColor:'#5C7A99', tension:0.2, pointRadius:3 });
    datasets.push({ label:'Deviation', data: months.map(m=>data[m].actual - data[m].target), borderColor:'#C1553B', backgroundColor:'#C1553B', tension:0.2, pointRadius:3 });
  } else {
    datasets.push({ label:'Amount (no fixed target for this bucket)', data: months.map(m=>data[m].actual), borderColor:'#6B8F63', backgroundColor:'#6B8F63', tension:0.2, pointRadius:3 });
  }

  chartInstances['hist-current'] = new Chart(canvas, {
    type:'line',
    data:{ labels, datasets },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{position:'bottom', labels:{boxWidth:10, color:'#8C8171'}} },
      scales:{ y:{ ticks:{ callback:v=>'$'+v.toLocaleString(), color:'#8C8171' }, grid:{color:'#E4D6BC'} }, x:{ ticks:{color:'#8C8171'}, grid:{display:false} } } }
  });
}

const BAKED_RAW = {"months": [], "monthly_category_net": {}, "monthly_txns": {}};

function txnHash(date, desc, amount, account){
  const str = date+'|'+desc+'|'+amount.toFixed(2)+'|'+(account||'');
  let hash=0;
  for(let i=0;i<str.length;i++){ hash = (hash*31 + str.charCodeAt(i))|0; }
  return 'h'+hash;
}

function extractWho(desc){
  const m = desc.match(/(?:E-TRANSFER|TRANSFER|REQUEST)\s+\d+\s*(.*)/i);
  let who = m ? m[1].trim() : '';
  who = who.replace(/\bTO CARD.*/i,'').trim();
  return who.toUpperCase();
}

function categorizeTxn(desc, debit, credit){
  const d = desc.toUpperCase();
  const isTransferish = d.includes('E-TRANSFER') || d.includes('INTERNET TRANSFER') || d.includes('FULFILL REQUEST');
  const who = isTransferish ? extractWho(desc) : '';
  if (personalRules.rentOut.some(n=>n && who.includes(n)) && debit>0) return 'Rent (to landlord)';
  if (personalRules.rentIn.some(n=>n && who.includes(n)) && credit>0) return 'Roommate reimbursement';
  if (d.includes('ICICI')) return 'ICICI (excluded)';
  if (personalRules.employers.some(n=>n && d.includes(n))) return 'Paycheque';
  if (d.includes('TAX REFUND') || d.includes('IMPÔT')) return 'Tax refund';
  if (d.includes('UBER')) return 'Uber';
  if (d.includes('FIT4LESS') || d.includes('GOODLIFE')) return 'Subscriptions';
  if (d.includes('APPLE.COM')) return 'Subscriptions';
  if (d.includes('ROGERS')) return 'Subscriptions';
  if (d.includes('PLAYSTATION')) return 'Subscriptions';
  if (d.includes('NETFLIX')||d.includes('SPOTIFY')||d.includes('AMAZON PRIME')||d.includes('DISNEY')||d.includes('CRAVE')||d.includes('XBOX')) return 'Subscriptions';
  if (d.includes('AVIVA')) return 'Insurance';
  if (d.includes('ENBRIDGE')) return 'Utilities';
  if (d.includes('MASTERCARD, TRIANGLE') || d.includes('TRIANGLE')) return 'Credit card payment';
  if (d.includes('AFFIRM') || d.includes('KLARNA')) return 'BNPL';
  if (d.includes('ATM WITHDRAWAL') || d.includes('NETWORK TRANSACTION FEE')) return 'ATM/fees';
  if (d.includes('OVERDRAFT') || d.includes('SERVICE CHARGE') || d.includes('RECORD-KEEPING')) return 'Bank fees';
  if (d.includes('CANNABIS')||d.includes('CANNA CABANA')||d.includes('LCBO')||d.includes('TAVERN')||d.includes('SCOOPS')||d.includes('CINEMAS')||d.includes('OXYGE')) return 'Discretionary (dining/leisure)';
  if (d.includes('REMITLY')) return 'Remitly (excluded)';
  if (d.includes('CPA PROF CORP')) return 'CPA fee';
  if (d.includes('ESSO')||d.includes('CIRCLE K')||d.includes('PETRO-CANADA')||d.includes('SHELL')) return 'Gas station';
  if (d.includes('TEMU')) return 'Online retail';
  if (isTransferish && who && personalRules.selfNames.some(n=>n && who.includes(n))) return 'Own-name transfer (excluded)';
  if (isTransferish) return 'Unclassified transfers';
  return 'Other/uncategorized';
}

function cleanDesc(desc){
  let d = desc;
  d = d.replace(/\b\d{6,}\b/g,'');
  d = d.replace(/Point of Sale - Visa Debit\s*/,'');
  d = d.replace(/VISA DEBIT (RETAIL PURCHASE|MERCHANDISE RET REV|PURCHASE REVERSAL)\s*/,'');
  d = d.replace(/CORRECTION\s*/,'Correction: ');
  d = d.replace(/Internet Banking\s*/,'');
  d = d.replace(/Electronic Funds Transfer\s*/,'');
  d = d.replace(/Point of Sale - Interac RETAIL PURCHASE\s*/,'');
  d = d.replace(/Branch Transaction\s*/,'');
  d = d.replace(/Automated Banking Machine\s*/,'');
  d = d.replace(/\s+/g,' ').trim();
  return d.slice(0,60);
}

  TXNS[m].forEach(t => {
    if (!t.account) t.account = 'Chequing';
    if (t.category === 'Other transfers') t.category = 'Unclassified transfers';
    t.id = txnHash(t.date, t.desc, t.amount, t.account);
  });
});
let learnedRules = {};

function merchantSignature(desc){
  let d = desc.toUpperCase();
  d = d.replace(/\d+/g, '');
  d = d.replace(/[^A-Z\s\/,.\-]/g, '');
  d = d.replace(/\s+/g, ' ').trim();
  return d;
}

async function loadLearnedRules(){
  try{ const s = await window.storage.get('dashboard-learned-rules'); if (s && s.value) learnedRules = JSON.parse(s.value); }catch(e){}
}
async function saveLearnedRules(){ try{ await window.storage.set('dashboard-learned-rules', JSON.stringify(learnedRules)); }catch(e){} }

function applyLearnedRules(){
  const affectedMonths = new Set();
  MONTHS.forEach(m => {
    TXNS[m].forEach(t => {
      if (overrides[t.id] && overrides[t.id].category) return; // explicit per-transaction pick wins
      const sig = merchantSignature(t.desc);
      const learned = learnedRules[sig];
      if (learned && learned !== t.category){
        t.category = learned;
        affectedMonths.add(m);
      }
    });
  });
  affectedMonths.forEach(m => recomputeMonthCategoryNet(m));
}

const CAT_GROUPS = {
  netRent: ['Rent (to landlord)','Roommate reimbursement'],
  uber: ['Uber'], insurance: ['Insurance'], utilities: ['Utilities'],
  subs: ['Subscriptions'], bnpl: ['BNPL'], cc: ['Credit card payment'],
  fees: ['Bank fees','ATM/fees'], discretionary: ['Discretionary (dining/leisure)','Gas station'],
  otherUncat: ['Other/uncategorized','CPA fee'], blindSpot: ['Unclassified transfers'],
  income: ['Paycheque','Tax refund']
};
function sumCat(monthObj, names){ let v=0; names.forEach(n=>{ if(monthObj[n]!==undefined) v+=monthObj[n]; }); return v; }
function groupTotals(monthObj){
  const g = {};
  Object.keys(CAT_GROUPS).forEach(k => g[k] = sumCat(monthObj, CAT_GROUPS[k]));
  g.income = -g.income;
  return g;
}
const spendKeys = ['netRent','uber','insurance','utilities','subs','bnpl','cc','fees','discretionary','otherUncat','blindSpot'];
const catSeriesDef = [
  {key:'netRent', label:'Net rent', color:'#5C7A99'}, {key:'uber', label:'Uber', color:'#D9713A'},
  {key:'insurance', label:'Insurance', color:'#9B7B93'}, {key:'utilities', label:'Utilities', color:'#6B8F63'},
  {key:'subs', label:'Subscriptions', color:'#B98089'}, {key:'bnpl', label:'BNPL', color:'#C1553B'},
  {key:'cc', label:'Credit card pmt', color:'#8C8171'}, {key:'fees', label:'Fees', color:'#8A6D3B'},
  {key:'discretionary', label:'Discretionary', color:'#E0A458'}, {key:'otherUncat', label:'Other', color:'#B4A996'},
  {key:'blindSpot', label:'Unclassified transfers', color:'#736A5B'}
];

function recomputeMonthCategoryNet(m){
  const totals = {};
  TXNS[m].forEach(t => { totals[t.category] = (totals[t.category]||0) + t.amount; });
  CATNET[m] = totals;
}
function nMonthsEstimate(){
  let minDate=null, maxDate=null;
  MONTHS.forEach(m => TXNS[m].forEach(t => {
    if (!minDate || t.date < minDate) minDate = t.date;
    if (!maxDate || t.date > maxDate) maxDate = t.date;
  }));
  if (!minDate) return 1;
  const days = (new Date(maxDate) - new Date(minDate)) / 86400000 + 1;
  return Math.max(days/30.44, 1);
}

async function persistUploadedTxns(newRecords){
  try{
    const s = await window.storage.get('dashboard-uploaded-all');

    all = all.concat(newRecords);

    await window.storage.set('dashboard-uploaded-txns', JSON.stringify(all));
    return true;
  }catch(e){ console.error(e); return false; }
}
function mergeTxnsIntoState(records, dedupe){
  const existingIds = new Set();
  MONTHS.forEach(m => TXNS[m].forEach(t => existingIds.add(t.id)));
  const affectedMonths = new Set();
  records.forEach(r => {
    if (dedupe && existingIds.has(r.id)) return;
    if (!TXNS[r.month]) { TXNS[r.month] = []; }
    TXNS[r.month].push(r);
    affectedMonths.add(r.month);
    existingIds.add(r.id);
  });
  affectedMonths.forEach(m => {
    if (!MONTHS.includes(m)) MONTHS.push(m);
    TXNS[m].sort((a,b) => a.date < b.date ? 1 : -1);
    recomputeMonthCategoryNet(m);
  });
  MONTHS.sort();
}
function parseCsvText(text, accountName){
  const parsed = Papa.parse(text.trim(), { skipEmptyLines:true });
  const records = [];
  parsed.data.forEach(row => {
    if (row.length < 4) return;
    const date = (row[0]||'').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const desc = (row[1]||'').trim();
    const debit = parseFloat(row[2]) || 0;
    const credit = parseFloat(row[3]) || 0;
    const category = categorizeTxn(desc, debit, credit);
    const amount = Math.round((debit - credit) * 100) / 100;
    const cleaned = cleanDesc(desc);
    const account = accountName || 'Unknown account';
    records.push({ date, month: date.slice(0,7), desc: cleaned, category, amount, account, id: txnHash(date, cleaned, amount, account) });
  });
  return records;
}

function wireCsvUpload(container, accountName){
  const dropZone = container.querySelector('.drop-zone');
  const fileInput = container.querySelector('.csv-file-input');
  const previewArea = container.querySelector('.preview-area');
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => { if (e.target.files.length) handleFile(e.target.files[0]); });

  function handleFile(file){
    const reader = new FileReader();
    reader.onload = () => {
      const text = reader.result;
      const existingIds = new Set();
      MONTHS.forEach(m => TXNS[m].forEach(t => existingIds.add(t.id)));
      const records = parseCsvText(text, accountName);
      const newOnes = records.filter(r => !existingIds.has(r.id));
      const dupCount = records.length - newOnes.length;
      pendingRecords = newOnes;

      if (!newOnes.length){
        previewArea.innerHTML = `<div class="status-msg">Parsed ${records.length} rows from ${accountName}, all ${dupCount} already in the dashboard — nothing new to add.</div>`;
        return;
      }
      const dates = newOnes.map(r=>r.date).sort();
      previewArea.innerHTML = `
        <div class="preview-summary">
          <div>
            <div><span class="stat">${newOnes.length}</span> new transactions from <span class="stat">${accountName}</span>${dupCount ? ` (${dupCount} duplicates skipped)` : ''}</div>
            <div class="kpi-sub">${dates[0]} → ${dates[dates.length-1]}</div>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="ghost-btn" id="cancelMergeBtn">Cancel</button>
            <button class="primary-btn" id="mergeBtn">Merge ${newOnes.length} transactions</button>
          </div>
        </div>
      `;
      previewArea.querySelector('#mergeBtn').addEventListener('click', async () => {
        mergeTxnsIntoState(pendingRecords, true);
        applyLearnedRules();
        const saved = await persistUploadedTxns(pendingRecords);
        pendingRecords = [];
        if (!saved){
          previewArea.innerHTML = `<div class="status-msg" style="color:var(--red);">Merged for this session, but saving to storage failed — these transactions may disappear on reload. Try uploading again shortly to be safe.</div>`;
          setTimeout(rebuildAll, 2500);
          return;
        }
        previewArea.innerHTML = `<div class="status-msg">Merged and saved. Rebuilding dashboard...</div>`;
        rebuildAll();
      });
      previewArea.querySelector('#cancelMergeBtn').addEventListener('click', () => {
        pendingRecords = [];
        previewArea.innerHTML = '';
        fileInput.value = '';
      });
    };
    reader.readAsText(file);
  }
}

      data:{ labels: barLabels, datasets:[{ data: barData, backgroundColor: barColors, borderRadius:4 }] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed.x)}}},
        scales:{ x:{ ticks:{ callback:v=>'$'+v.toLocaleString(), color:'#8C8171' }, grid:{color:'#E4D6BC'} }, y:{ ticks:{ color:'#8C8171', autoSkip:false, font:{size:11} }, grid:{display:false} } } }
    });
  }, 0);
}

function renderTxnRow(t, allCategories){
  const catOptions = allCategories.map(c => `<option value="${c}" ${getDisplayCategory(t)===c?'selected':''}>${c}</option>`).join('');
  const pendingCls = pendingChanges[t.id] !== undefined ? ' pending-edit' : '';
  return `<tr class="${t.amount<0?'income':'expense'}" data-txn="${t.id}">
      <td>${t.date.slice(5)}</td>
      <td>${t.desc}</td>
      <td><span class="cat-pill">${getAccount(t)}</span></td>
      <td><select class="cat-select${pendingCls}" data-txn="${t.id}">${catOptions}</select></td>
      <td><input class="note-input" data-txn="${t.id}" type="text" placeholder="add a note..." value="${getNote(t)}"></td>
      <td class="num">${fmt(t.amount)}</td>
    </tr>`;
}
function findTxnById(id){
  for (const m of MONTHS){
    const found = TXNS[m].find(t => t.id === id);
    if (found) return found;
  }
  return null;
}

let pendingChanges = {};

function updateAcceptButton(){
  const btn = document.getElementById('acceptChangesBtn');
  if (!btn) return;
  const count = Object.keys(pendingChanges).length;
  if (count > 0){
    btn.style.display = 'inline-flex';
    btn.textContent = `Accept ${count} change${count>1?'s':''}`;
  } else {
    btn.style.display = 'none';
  }
}

async function acceptPendingChanges(){
  const ids = Object.keys(pendingChanges);
  if (!ids.length) return;
  ids.forEach(id => {
    const txn = findTxnById(id);
    if (txn){
      const sig = merchantSignature(txn.desc);
      if (sig) learnedRules[sig] = pendingChanges[id];
    }
  });
  pendingChanges = {};
  await saveLearnedRules();
  applyLearnedRules();
  refreshOverviewContents();

  const picker = document.getElementById('monthPicker');
  if (picker){
    const currentFilterSel = document.getElementById('filter-'+picker.value);
    const preservedFilter = currentFilterSel ? currentFilterSel.value : 'all';
    renderMonthDetail(picker.value);
    const newFilterSel = document.getElementById('filter-'+picker.value);
    if (newFilterSel && preservedFilter !== 'all'){
      newFilterSel.value = preservedFilter;
      newFilterSel.dispatchEvent(new Event('change'));
    }
  }
  updateAcceptButton();
}

function wireTxnControls(container){
  container.querySelectorAll('.cat-select[data-txn]').forEach(sel => {
    sel.addEventListener('change', async e => {
      const id = e.target.dataset.txn;
      const newCat = e.target.value;
      if (!overrides[id]) overrides[id] = {};
      overrides[id].category = newCat;
      await saveOverrides();
      pendingChanges[id] = newCat;
      e.target.classList.add('pending-edit');
      updateAcceptButton();
    });
  });
  container.querySelectorAll('.note-input').forEach(inp => {
    inp.addEventListener('change', e => {
      const id = e.target.dataset.txn;
      if (!overrides[id]) overrides[id] = {};
      overrides[id].note = e.target.value;
      saveOverrides();
    });
  });
  const acceptBtn = container.querySelector('#acceptChangesBtn');
  if (acceptBtn) acceptBtn.addEventListener('click', acceptPendingChanges);
  updateAcceptButton();
}

let pendingRecords = [];

/* =========================================================
   TOP-LEVEL ORCHESTRATION
   ========================================================= */
let builtSections = new Set();

function activateTab(id){
  if (!builtSections.has(id)){
    if (id==='overview') buildOverview();
    else if (id==='buckets') buildBucketsSection();
    else if (id==='history') buildHistoryTabSection();
    else if (id==='accounts') buildAccountsSection();
    builtSections.add(id);
  }
  showTab(id);
}

function buildTabs(){
  tabsEl.innerHTML = '';
  const tabIds = ['overview','buckets','history','accounts'];
  const labelFor = id => id==='buckets' ? 'Buckets' : (id==='history' ? 'History' : (id==='accounts' ? 'Accounts' : 'Overview'));
  tabIds.forEach((id) => {
    const btn = document.createElement('button');
    let cls = 'tab-btn';
    if (id==='buckets' || id==='history' || id==='accounts') cls += ' primary-tab';
    btn.className = cls;
    btn.textContent = labelFor(id);
    btn.onclick = () => activateTab(id);
    btn.dataset.tab = id;
    tabsEl.appendChild(btn);
  });
}

function renderHero(){
  const dateEl = document.getElementById('heroDate');
  if (dateEl) dateEl.textContent = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
}

function rebuildAll(){
  destroyCharts();
  tabsEl.innerHTML = '';
  sectionsEl.innerHTML = '';
  builtSections = new Set();
  buildTabs();
  activateTab('overview');
  renderHero();
}

/* Ask the browser to mark our IndexedDB as persistent. Without this, storage is
   "best-effort" and can be evicted under disk pressure with no warning. Granting
   is at the browser's discretion (Chrome tends to grant for installed PWAs and
   engaged sites) and it never prompts, so a refusal is harmless — the data still
   works, it's just evictable. Not a substitute for downloading a backup. */
async function requestPersistentStorage(){
  try{
    if (!navigator.storage || !navigator.storage.persist) return null;
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  }catch(e){ return null; }
}

async function init(){
  await requestPersistentStorage();
  await loadBucketState();
  await loadOverrides();
  await loadUploadedTxns();
  await loadLearnedRules();
  await loadAccounts();
  await loadAccountChangeLog();
  await loadPersonalRules();
  await loadSavingsGoals();
  applyLearnedRules();
  rebuildAll();
}
init();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed', err));
  });
}
